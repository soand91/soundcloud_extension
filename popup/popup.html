<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <div class="popup-wrapper">
            <h1>SoundCloud UI Extender</h1>
            <div class="settings">
                <header id="settings-header">
                    <h2>User Settings</h2>
                </header>
                <div class="toolbar-default">
                    <label class="switch">
                        <input type="checkbox" id="start-open-toggle">
                        <span class="slider"></span>
                    </label>
                    Toolbar default: <span id="start-open-toggle-label">closed</span>
                </div>
                <div class="active-default">
                    <label class="switch">
                        <input type="checkbox" id="active-tab-toggle">
                        <span class="slider"></span>
                    </label>
                    Active Tab Priority: <span id="active-tab-toggle-label">Popup-select</span>
                </div>
                <div class="theme-default">
                    <label class="switch">
                        <input type="checkbox" id="theme-default-toggle">
                        <span class="slider"></span>
                    </label>
                    <span id="theme-default-toggle-label">
                        Light Mode
                    </span>
                </div>
            </div>
            <div class="SC-tabs-list">
                <h2>Open SoundCloud Tabs</h2>
            </div>
            <div class="report-card">
                <div id="page-info" class="report-info">
                <div>
                    <h3>Report Page or UI Issue</h3>
                    <label for="report-url" class="report-label">Page URL</label>
                    <input type="text" id="report-url" class="report-input" readonly />
                    <fieldset class="report-fieldset">
                    <legend class="report-legend">What seems broken?</legend>
                    <label class="report-radio">
                        <input type="radio" name="issue-type" value="page" checked/>
                        The page itself (content/layout)
                    </label>
                    <label class="report-radio">
                        <input type="radio" name="issue-type" value="ui"/>
                        The extension UI 
                    </label>
                    <label class="report-radio">
                        <input type="radio" name="issue-type" value="both"/>
                        Both
                    </label>
                    </fieldset>
                </div>
                <div>
                    <div class="report-text-wrapper">
                    <label for="additional-info" class="report-label">Additional details</label>
                    <textarea id="additional-info" class="report-textarea" rows="3" placeholder="Optional additional details..."></textarea>
                    </div>
                </div>
                </div>
                <div id="playback-info" class="report-info hidden">
                <div>
                    <h3>Report Playback or Messaging Issue</h3>
                    <fieldset class="report-fieldset">
                    <legend class="report-legend">What seems broken?</legend>
                    <label class="report-radio">
                        <input type="radio" name="messaging-issue" value="no-playback-response"/>Playback buttons do nothing
                    </label>
                    <label class="report-radio">
                        <input type="radio" name="messaging-issue" value="audio-desync"/>Audio is out of sync with controls
                    </label>
                    <label class="report-radio">
                        <input type="radio" name="messaging-issue" value="no-tab-communication"/>Extension is playing from the wrong tab
                    </label>
                    <label class="report-radio">
                        <input type="radio" name="messaging-issue" value="other"/>Something else
                    </label>
                    </fieldset>
                </div>
                <div>
                    <div class="report-text-wrapper">
                    <label for="messaging-info" class="report-label">Additional details</label>
                    <textarea id="messaging-info" class="report-textarea" rows="3" placeholder="Optional additional details..."></textarea>
                    </div>
                </div>
                </div>
                <span id="send-container">
                <button id="send-Btn">Send</button>
                </span>
                <span></span>
                <span id="playback" class="report-tab">Playback</span>
                <span id="page" class="report-tab selected">Page/UI</span>
            </div>
            <div class="report-section">
                <h3>Broken page? Report here</h3>
                <span id="report-Btn">
                <svg class="report-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" stroke="currentColor" fill="currentColor">
                    <path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zm0-384c13.3 0 24 10.7 24 24l0 112c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-112c0-13.3 10.7-24 24-24zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/>
                </svg>
                </span>
            </div>            
        </div>
        <script src="popup.js"></script>
    </body>
</html>
